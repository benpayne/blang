# devbot epic manifest — blang-ast
# Compiled into a run by /devbot-launch; the devbot: section is filled then.

epic: blang-ast
title: "True language enforcement via semantic analysis"
archetype: evolve
status: planning
docs_root: docs/epics/blang-ast
entry_point: overview.md
constitution: .specify/memory/constitution.md

description: >
  Introduce a dedicated semantic-analysis pass over a location-bearing AST
  that enforces BLang's type system, ownership rules, and concurrency rules
  in all build modes, with clean file:line:col diagnostics, and migrate the
  existing tests, stdlib, and demos to be correct under the new checker.

# Duplicated verbatim from overview.md — keep in sync.
done_condition: |
  All of the following, on a clean checkout of the epic's final state:
  1. ./run_tests.sh exits 0 in both a parse-only build and an LLVM build,
     with expected-error assertion mode active for fail/ and cgfail/.
  2. ./test_codegen.sh exits 0 on the LLVM build.
  3. test_files/fail/sema/ contains >= 25 negative tests (including the 10
     audit miscompile programs); for each, qcc --parse-only exits non-zero
     AND its stderr matches the regex '^[^:]+\.b:[0-9]+:[0-9]+: error: '
     AND matches the per-test expected-message pattern.
  4. qcc test_files/pass/func_simple.b (no flags) produces zero bytes of
     output on stdout and stderr (exit 0, silent).
  5. The audit return-mismatch programs no longer compile; and
     ./test_codegen.sh --leak-check exits 0 for the concurrency test subset
     (codegen_spawn*.b, codegen_sync*.b, codegen_shared*.b).

workplan: workplan.md
units: [U1, U2, U3, U4, U5, U6, U7, U8]
parallelizable:
  - [U5, U6, U7]   # independent after U4

hires:
  # Roster compiled into the run at /devbot-launch. The manager is devbot
  # itself (directs phases, gates transitions, serializes merges) — not a hire.
  - role: implementer
    count: 1..3                 # one per unit in flight; up to 3 only during
                                # the U5/U6/U7 parallel window
    assignment: one unit at a time, per the workplan dependency map
    duties: >
      Phase 1 (speckit ceremony: specify/clarify/plan/tasks) and Phase 3
      (speckit implement) for their unit; run per-unit gates locally before
      requesting review; address spec-audit and code-review findings.
  - role: secondary-reviewer
    count: 1                    # single reviewer for the whole epic, for
                                # consistent standards across units
    independence: must not implement any unit it reviews
    duties: >
      Phase 2 spec audits and Phase 4 code audits per evaluation.md rubrics;
      independently re-run all gate commands; Phase 5 merge mechanics
      (rebase, re-gate, squash-merge, branch deletion). Sole authority to
      merge to master.

execution:
  # Five-phase lifecycle per unit; manager gates every transition.
  # Full definition: workplan.md "Unit lifecycle"; rubrics: evaluation.md.
  unit_lifecycle:
    - phase: create_spec       # speckit: specify -> clarify? -> plan -> tasks
      actor: implementer-hire
      output: "specs/<NNN>-<slug>/ committed on unit branch; draft PR opened"
    - phase: audit_spec        # gate: no implementation until approved
      actor: secondary-reviewer-hire
      rubric: "evaluation.md 'Spec audit rubric'"
    - phase: implement         # speckit: implement, on the same branch
      actor: implementer-hire
      exit: "per-unit gates pass locally; PR marked ready"
    - phase: audit_code        # gate: reviewer re-runs gates independently
      actor: secondary-reviewer-hire
      rubric: "evaluation.md 'Code review rubric'"
    - phase: merge
      actor: secondary-reviewer-hire
      action: "rebase onto master, re-run gates if changed, squash-merge, delete branch"
  git:
    base_branch: master
    branch_pattern: "epic/blang-ast/u{N}-{slug}"
    pr_title_pattern: "[blang-ast][U{N}] {title}"
    draft_pr_from: create_spec        # PR exists from Phase 1 as draft
    merge_method: squash              # one commit per unit on master
    rebase_before_merge: true
    delete_branch_on_merge: true
    direct_commits_to_master: forbidden
    parallel_units:
      cut_from: "master after U4 merges"
      merge_serialization: manager    # U6 before U7 on conflict; rebase + re-gate after each merge

# Limits sized ~2x honest estimates (8 units, focused PRs).
limits:
  max_units: 8
  max_open_prs: 3
  max_iterations_per_unit: 6        # spec->implement->review cycles
  max_review_rounds_per_pr: 4
  max_files_changed_per_pr: 60      # honest estimate 5-25
  wallclock_days: 14                # honest estimate ~1 week
  escalation: pause_and_ask         # surface blockers via /devbot-status

gates:
  per_unit:
    - "./run_tests.sh"                     # both build modes
    - "./test_codegen.sh"
    - "quiet-compile check (evaluation.md #5, from U2 onward)"
    - "./test_codegen.sh --leak-check (units touching runtime/ARC/concurrency)"
  epic:
    - "evaluation.md 'Epic-level acceptance' block, executed literally"

devbot:
  run_id: null
  project_id: null
  manager: null
  launched_at: null
