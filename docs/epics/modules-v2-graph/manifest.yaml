# manifest.yaml — machine-readable compilation of the modules-v2-graph epic.
# v0: compiled by /devbot-launch into devbot REST calls.

manifest_version: 0
epic: modules-v2-graph
entry: overview.md
archetype: evolve
constitution: .specify/memory/constitution.md

run:
  # Epic-level done condition — duplicated from overview.md verbatim.
  done_condition: |
    All of the following hold on `master` after the epic's PRs merge, each backed by
    a committed test that CI runs:

    1. **Module identity keys mangling — no `linkonce_odr` collapse.** A
       `test_build/` fixture with two path-dependency modules that each export a
       same-named generic type (e.g. `Box<int>`), both instantiated by one binary,
       builds/links/runs with the two treated as **distinct types with distinct
       mangled symbols** (verified by `nm`/IR inspection in the fixture's script) —
       the P10 miscompile is gone.
    2. **Three declared type tiers.** The hardcoded `isGlobalTypeLib` promotion list
       (`qcc.cpp:308-309`) is replaced by a declared, compiler-shipped **prelude
       manifest** whose membership is exactly `{Map, Set, Buffer}` (types only); the
       bare-name `addType` registrations with no definition behind them
       (`QModule.cpp:582-584`) are **deleted** (a program using such a name with no
       backing definition now fails at the *type*, proven by a `fail/sema` fixture
       asserting the located error is at the type, not a later symbol lookup); and
       `cli` is an ordinary qualified library module (`cli.has_flag`-style access),
       not promoted. Because `stdlib/collections.b` is a **mixed module** — it defines
       the prelude types `Map`/`Set` *and* the free function `sort` — the manifest
       assigns tiers **per name** (types → prelude; `sort` → qualified
       `collections.sort`), and the bare `sort(...)` call sites (e.g.
       `examples/wordfreq/main.b`) are migrated to `collections.sort(...)` with their
       goldens. `run_tests.sh`/`test_codegen.sh` green in both modes.
    3. **Module-prefix codegen fixed; special cases retired; `--leak-check` clean.**
       The string-ARC double-free under namespaced-module codegen
       (`qcc.cpp:303-307` rationale) is fixed; the `buffer`/`collections`/`cli`
       global-scope promotions are removed and namespacing is uniform; a
       `test_codegen`/`test_build` fixture exercises a namespaced module's internal
       string-returning call path and is `--leak-check` clean (**KI-3 closed**).
    4. **Per-module graph via a standalone resolver (behavior-neutral).** Resolution
       runs through per-module export scopes connected by import edges, implemented as
       a **standalone resolver component** (a named class, not inline in `qcc.cpp`
       `main()`), exercised by a dedicated `ctest` independent of the driver. This
       unit keeps the global fallback so it is **behavior-neutral** — all prior gates
       stay green with no behavior change. (Removal of the global injection block is
       done-condition 6, at import enforcement.)
    5. **The resolver is the single shared entry point (Epic C seam).** One resolver
       entry point is invoked from **both** `qcc.cpp` and `lsp/Compile.cpp` (both call
       sites grep-verifiable), and a `ResolverReuseTest` `ctest` constructs the
       resolver exactly as `lsp/Compile.cpp` does and asserts a fixture resolves
       identically to the `qcc` path — so Epic C wires cross-module resolution without
       re-plumbing. (blangd stays single-file this epic.)
    6. **Imports are enforced; use vs. name capability (D7); injection removed.**
       Using a symbol whose module is not imported is a located `file:line:col:
       error:` (`fail/sema` fixtures, both build modes); imported names are written
       qualified (`module.name`, D1); **use-capability** (receiving/holding/passing/
       returning a foreign type and calling its `pub` methods) needs no import, while
       **name-capability** (declaring a variable of it, annotating a param, storing
       it in a struct, constructing one) requires the import — each direction has a
       positive and a negative fixture. The up-front global-symbol injection block
       (`qcc.cpp:330-381`) is **removed** — resolution now goes through the graph.
    7. **Foreign type references in `.bmod`; transitive build graph; the un-named
       generic path.** The `.bmod` format references a type owned by another module
       **by identity, rendered through the reading module's qualifier** (it has no
       such mechanism today), and carries each module's human-facing name for
       diagnostics; the transitive `.bmod` closure is assembled so use-capability
       holds for indirectly-reached types. Two `test_build/` fixtures: (a) a
       transitive dependency (`A → X → Q`, `A` uses a `Q` type via `X` without
       importing `Q`) builds and runs; **(b) the sharpest corner — a binary calls a
       `pub` method returning a foreign generic (`Box<T>`) from a module it does NOT
       `import`, monomorphizes the body shipped in the `.bmod`, links, and runs**
       (D7 use-capability across an un-named module). Cross-module generics still
       build and link (format bump 4→5; cache invalidation proven).
    8. **Collision & import diagnostics.** Duplicate exported names across imported
       modules, unknown-module imports, and unused imports each emit a located
       diagnostic through the `DiagnosticEngine` (unused-import is a warning);
       `fail/sema` fixtures with `.expected` patterns, deterministic display-name
       rendering (D3).
    9. **Combine-mode field privacy is Sema-enforced (KI-23 closed).** A consumer
       reaching into a namespaced-stdlib struct's private field in combine mode is a
       located Sema error (the rule keys on "defined in a different module than the
       use site," using module identity — not the `.bmod`-arrival-only
       `isFromInterface()` heuristic), proven by a `fail/xmodule` or `fail/sema`
       fixture; the reach-in grep gate stops being the only guard.
    10. **Import aliasing (stretch).** `import x as y;` binds the module to the local
       qualifier `y`; a positive `test_build`/codegen fixture and a `fail/sema`
       negative (re-export still unavailable, D8).
    11. **Module search path / std separation (stretch).** The hardcoded
        `stdlib/<name>.b` mapping is replaced by configurable resolution roots so a
        user module can shadow/replace a stdlib name deterministically; a
        `test_build` fixture with a custom resolution root resolves a user `timer`
        over stdlib `timer` (P7).
    12. **No regressions; docs updated.** `./run_tests.sh` and `./test_codegen.sh`
        fully green in both build modes; `./test_codegen.sh --leak-check` clean;
        `./test_lsp.sh` green (blangd untouched beyond keeping it building against the
        extracted resolver); `test_build/run_build_tests.sh` green; `.bmod` +
        git/path deps + cross-module generics still build and link end to end; docs
        updated (`docs/language_design.md` + `CLAUDE.md`) per Principle I; GitHub CI
        green on `master`.
  guidance: >
    Start by reading docs/epics/modules-v2-graph/overview.md and its companions (workplan.md, design.md, evaluation.md) — especially overview's 'Scope decisions' and 'Inherited known-issues' sections. Then read docs/epics/modules-v2/overview.md: its decision record D1-D17 is binding and its pain points P1-P11 are the problems this epic closes; do not relitigate the decisions (both open questions there are already answered). Honor the constitution at .specify/memory/constitution.md (v1.2.0), including the design-audit-before-implementation rule (Principle VI, named on U1 and U2) and the PR + distinct-secondary-reviewer merge policy. Follow the workplan units in dependency order: U1 (canonical module identity) and U2 (the module-prefix string-ARC codegen fix) are the two foundations and run in parallel; U2 is a SPIKE-FIRST crux and must land with --leak-check proof BEFORE U3 demotes the cli promotion (review F3) — never demote a promoted module before its double-free is fixed. Keep the global-resolution fallback in U4 (behavior-neutral) and remove it in U6 atomically with import enforcement. Extract resolution into a standalone component both qcc and blangd construct (the Epic C seam) — do NOT wire blangd to resolve across modules (that is Epic C, modules-v2-lsp) but keep test_lsp.sh green. U6 is the corpus-churn unit; split it U6a/U6b if the budget runs short rather than cutting fixtures. U8/U9 are stretch; if the budget is exhausted after U7 they may be deferred to a follow-on (record in Known Issues) without failing the core done-condition. Do NOT touch the Epic-A export model (opaque types, factory, .bmod signature emission), ARC semantics, ownership, or the concurrency model beyond U2's fix. Bump the .bmod format version (currently 4) at U5 and confirm the salt reaches BuildCache::computeKey. Raise questions instead of guessing on anything marked as an open question.
  oversight_level: fully_autonomous
  # Generous limits for a ~9-unit resolution-model epic (Epic A's 2-unit redo was
  # ~16 turns / 3.3M tokens). The epic may be executed in SCOPED PASSES across
  # several runs (as Epic A was) rather than one marathon; these ceilings size a
  # single large pass at ~2x an honest whole-epic estimate. NOTE: the workplan's
  # per-unit "budget hint" turns are HIRE-INTERNAL working turns (a hire's own
  # loop), NOT controller/manager turns — they do not sum against max_turns
  # (which counts manager turns). A single pass is expected to cover ~U1-U4/U5
  # before a natural checkpoint; the manager launches subsequent passes for the
  # rest.
  limits:
    max_turns: 160
    max_runtime_seconds: 129600      # 36h
    session_token_limit: 16000000
  # Both prior modules-v2 runs died to transient infra, not lack of progress.
  no_progress_threshold: 10
  models:
    controller: null          # devbot default manager model
    worker: null              # manager staffs hires per unit

units:
  - id: U1
    reqs: [REQ-001, REQ-002]
    summary: Canonical module identity (keystone; Principle VI design-audit gate)
    depends_on: []
    done: test_build fixture with two path-dep modules exporting a same-named generic type builds/links/runs with distinct mangled symbols (no linkonce_odr collapse); full gates green
    speckit: 034-canonical-module-identity
  - id: U2
    reqs: [REQ-005]
    summary: Module-prefix string-ARC codegen fix (spike-first crux; security-mandatory)
    depends_on: []
    done: namespaced-module internal string-returning path is --leak-check clean (previously double-freed); no regression; full gates green
    speckit: 035-module-prefix-codegen-fix
  - id: U3
    reqs: [REQ-003, REQ-004, REQ-005]
    summary: Three type tiers core/prelude/library; delete bare-name registration; demote cli
    depends_on: [U2]
    done: prelude manifest {Map,Set,Buffer} is the single source (no driver string list); undefined-type-name errors at the type (fail/sema); cli used qualified; full gates green both modes
    speckit: 036-type-tiers
  - id: U4
    reqs: [REQ-006, REQ-007]
    summary: Module graph & per-module export scopes; extract a standalone resolver both qcc and blangd construct
    depends_on: [U1]
    done: ctest exercises the resolver independent of the driver; qcc and blangd both link it; behavior-neutral (all prior gates green)
    speckit: 037-module-graph-and-resolver
  - id: U5
    reqs: [REQ-009]
    summary: Foreign type refs in .bmod (by identity, reader's qualifier) + transitive build graph; format 4->5
    depends_on: [U1, U4]
    done: transitive-dep test_build fixture (A->X->Q, A uses Q via X without importing Q) builds/runs; the un-named foreign-generic fixture (binary calls a pub method returning Box<T> from a module it does NOT import, monomorphizes, links, runs) passes; cross-module generics link; cache-invalidation test passes
    speckit: 038-bmod-foreign-refs-transitive-graph
  - id: U6
    reqs: [REQ-008, REQ-011]
    summary: Enforce import edges; use vs name capability (D7); remove global injection; close KI-23; corpus migration
    depends_on: [U3, U4, U5]
    done: fail/sema fixtures (unimported-symbol use; name-without-import) match .expected both modes; use-without-import positive; KI-23 combine-mode field-privacy fixture; injection block removed; full gates green
    speckit: 039-enforce-imports-and-capability
  - id: U7
    reqs: [REQ-010, REQ-014]   # REQ-014 (no-regressions/docs/CI) is cross-cutting — every unit's gates enforce it; the epic-completion functional review lands here
    summary: Collision & import diagnostics; deterministic display names (D3)
    depends_on: [U6]
    done: fail/sema fixtures for duplicate-export, unknown-import, unused-import(warning); display-name rule deterministic and pinned; full gates green
    speckit: 040-collision-and-import-diagnostics
  - id: U8
    reqs: [REQ-012]
    summary: Import aliasing `import x as y` (stretch)
    depends_on: [U6]
    done: positive test_build/codegen fixture using `as`; fail/sema negative proving re-export unavailable (D8); full gates green
    speckit: 041-import-aliasing
  - id: U9
    reqs: [REQ-013]
    summary: Module search path / std separation (stretch)
    depends_on: [U3, U6]
    done: test_build fixture with a custom resolution root resolves a user `timer` over stdlib `timer`; default behavior unchanged; full gates green
    speckit: 042-module-search-path

