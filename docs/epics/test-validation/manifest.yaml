# manifest.yaml — machine-readable compilation of the test-validation epic.

manifest_version: 0
epic: test-validation
entry: overview.md
archetype: evolve
constitution: .specify/memory/constitution.md

run:
  # Duplicated from overview.md "Done condition (epic level)" verbatim.
  done_condition: |
    All of the following succeed on a clean checkout of the epic's final state,
    run from the repo root (concrete commands and thresholds in evaluation.md):

    1. Goldens with teeth. Every codegen test not on the documented
       non-deterministic quarantine list has a committed stdout golden
       (`ls test_files/codegen_*.expected.out | wc -l` >= 63 - |quarantine|,
       quarantine listed in test_files/codegen_quarantine.txt); ./test_codegen.sh
       exits 0 comparing captured stdout to each golden; and the harness
       self-check proves teeth — corrupting any one golden makes the suite exit
       non-zero (./test_codegen.sh --selfcheck exits non-zero).
    2. Real bcc test. On the committed fixtures,
       `bcc test test_files/testblock/all_pass.b` exits 0 and prints a pass count;
       `bcc test test_files/testblock/has_failure.b` exits non-zero, prints
       per-test PASS/FAIL, a total, and a <file>.b:<line>: location for the failed
       assert; `bcc test --filter <name>` runs only matching tests.
    3. Sanitizers in CI. A sanitizer build of the compiler
       (`cmake -B build-asan -DBLANG_SANITIZE=address,undefined`) builds clean and
       `BUILD_DIR=build-asan ./run_tests.sh` exits 0; `./test_codegen.sh --leak-check`
       exits 0 with 0 leaks over the deterministic suite; both are required CI jobs.
    4. Runtime unit tests. `ctest --test-dir build` exits 0 with >= 30 runtime
       unit tests covering blang_array/string/buffer/net/fs/json including
       bounds/error paths, and the runtime-test target builds and runs under ASan.
    5. Bounded fuzzing. The libFuzzer target fuzz_parse builds; replaying the
       committed corpus (`build/fuzz_parse test_files/fuzz/corpus/ -runs=0`) exits 0
       (no crash); CI runs a fixed-budget campaign leg.
    6. CI enforces it all. .github/workflows/ci.yml defines required jobs for
       goldens, bcc test, the ASan/leak legs, ctest runtime units, the fuzz
       smoke/campaign, and `make -C demos run`; a regression in any one fails CI.

  guidance: |
    Start by reading docs/epics/test-validation/overview.md and its companion
    documents (workplan.md, design.md, evaluation.md). Read
    .specify/memory/constitution.md first — it governs all work; the quality
    gates and audit pattern are non-negotiable. Follow the five-phase unit
    lifecycle (create spec via speckit → spec audit → implement → code audit →
    merge) for every unit, in dependency order (U1→U2 chain; U3/U4/U5/U6
    parallel after baseline; U7 capstone last). Use an implementer hire and an
    independent secondary-reviewer hire; the reviewer must not implement what it
    reviews and is the only actor that merges. All work on
    epic/test-validation/uN-<slug> branches; squash-merge only; never commit to
    master directly. Every unit boundary leaves ./run_tests.sh and
    ./test_codegen.sh green. New checks must have teeth — a gate that passes
    trivially is a review-blocking finding. Handle test non-determinism with an
    explicit quarantine list, never loose matching. When a wrong-output or memory
    bug is surfaced, fixing it is in scope; if the fix is large/risky or needs a
    language decision, raise an Open Question via run status instead of guessing.

  oversight_level: fully_autonomous
  limits:
    # Lesson from blang-ast: the launch run halted on a no_progress alert
    # (threshold 3) triggered by Anthropic usage-window pauses, not by the token
    # budget. High no_progress_threshold + large session cap avoid that.
    max_turns: 400
    max_runtime_seconds: 1209600        # 14 days
    session_token_limit: 50000000       # 50M; effectively "extended way out"
    no_progress_threshold: 10
  models:
    controller: claude-opus-4-8
    worker: claude-sonnet-5

units:
  - id: U1
    reqs: [REQ-001]
    summary: Golden-output harness — capture+compare stdout, --update-goldens, --selfcheck, quarantine mechanism
    depends_on: []
    done: "./test_codegen.sh --selfcheck exits non-zero; goldens compared on normal run; all suites green"
    speckit: golden-harness
  - id: U2
    reqs: [REQ-002]
    summary: Golden migration — commit stdout goldens for all deterministic codegen tests; populate quarantine list
    depends_on: [U1]
    done: "golden count >= 63 - |quarantine|; ./test_codegen.sh exit 0; quarantine file documents each exclusion"
    speckit: golden-migration
  - id: U3
    reqs: [REQ-003]
    summary: Real bcc test runner — compile+run test{} blocks, counts, --filter, file:line on failure
    depends_on: []
    done: "all_pass fixture exit 0; has_failure fixture exit non-zero with PASS/FAIL + file:line; --filter works"
    speckit: bcc-test-runner
  - id: U4
    reqs: [REQ-004]
    summary: Sanitizer builds (BLANG_SANITIZE) + ASan/LSan and leak-check CI legs
    depends_on: []
    done: "build-asan builds; BUILD_DIR=build-asan ./run_tests.sh exit 0; --leak-check 0 leaks; wired in CI"
    speckit: sanitizer-ci
  - id: U5
    reqs: [REQ-005]
    summary: Runtime C unit tests for array/string/buffer/net/fs/json via CTest, ASan-clean
    depends_on: []
    done: "ctest --test-dir build exit 0, >= 30 tests; runtime-test target ASan-clean"
    speckit: runtime-unit-tests
  - id: U6
    reqs: [REQ-006]
    summary: Bounded libFuzzer target for lexer+parser; seed corpus; fixed campaign; fix-or-quarantine crashes
    depends_on: []
    done: "fuzz_parse builds; corpus replay -runs=0 exit 0; CI campaign leg; crashes fixed or quarantined"
    speckit: parser-fuzzing
  - id: U7
    reqs: [REQ-007]
    summary: CI integration of all new checks as required gates + demos run leg + docs/close-out
    depends_on: [U1, U2, U3, U4, U5, U6]
    done: "evaluation.md Epic-level acceptance block passes; ci.yml has named required jobs; make -C demos run is a CI leg"
    speckit: ci-integration

foldback:
  status_into: overview.md

devbot:
  endpoint: null
  directory_id: null
  runs: []
