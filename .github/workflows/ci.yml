name: BLang CI

on:
  push:
    branches: [ master, main, 'claude/**', 'epic/**' ]
  pull_request:
    branches: [ master, main ]

# All jobs below EXECUTE a check (they do not grep ci.yml). A regression in any
# leg fails CI. Configuring these as branch-protection "required" checks is a
# manual manager step — see docs/ci.md.

jobs:
  # ---- Existing legs (preserved): parse/sema suite in both build modes ----
  parse-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [parse-only, with-llvm]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev pkg-config libsqlite3-dev
          if [ "${{ matrix.build_type }}" = "with-llvm" ]; then
            sudo apt-get install -y llvm-18-dev llvm-18 libzstd-dev
          fi
      - name: Configure & build
        run: |
          if [ "${{ matrix.build_type }}" = "with-llvm" ]; then
            cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          else
            cmake -S . -B build -DBLANG_ENABLE_LLVM=OFF
          fi
          cmake --build build -j"$(nproc)"
      - name: run_tests.sh
        run: ./run_tests.sh

  # ---- 1. Golden-output codegen compare + teeth (--selfcheck) ----
  golden-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # pkg-config + libsqlite3-dev so the database codegen_*.b goldens
          # (codegen_db_query, codegen_db_query_rows) run against a real SQLite
          # backend here instead of SKIP-ping (origin's DB codegen leg).
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Anti-widening teeth — golden floor >= 55 + quarantine == approved
        run: |
          # The epic's most load-bearing gate. There MUST be >= 55 committed
          # stdout goldens, and codegen_quarantine.txt MUST exactly equal the
          # approved list (symmetric comment/blank strip, per evaluation.md
          # clause 1) so the quarantine cannot be widened to nullify goldens.
          n=$(ls test_files/codegen_*.expected.out | wc -l)
          echo "goldens: $n"
          test "$n" -ge 55
          if ! diff <(sort -u test_files/codegen_quarantine.txt | grep -vE '^\s*#|^\s*$') \
                    <(sort -u docs/epics/test-validation/approved_quarantine.txt | grep -vE '^\s*#|^\s*$'); then
            echo "FAIL: codegen_quarantine.txt diverges from the approved list (widening?)"
            exit 1
          fi
          echo "Anti-widening verified: >= 55 goldens; quarantine == approved list."
      - name: Golden compare (./test_codegen.sh)
        run: ./test_codegen.sh
      - name: Golden teeth (--selfcheck must flip red)
        run: |
          # --selfcheck corrupts a real golden internally and MUST exit non-zero,
          # printing SELFCHECK: OK. A zero exit here means the comparator has no
          # teeth — fail the job.
          if ./test_codegen.sh --selfcheck > selfcheck.log 2>&1; then
            echo "FAIL: --selfcheck exited 0 (golden comparator has no teeth)"
            cat selfcheck.log
            exit 1
          fi
          grep -q 'SELFCHECK: OK' selfcheck.log || {
            echo "FAIL: --selfcheck did not print SELFCHECK: OK"; cat selfcheck.log; exit 1; }
          echo "Golden teeth verified: --selfcheck flipped red as designed."

  # ---- 1b. Optimization: whole codegen suite built at -O2 (U2/U6) ----
  # Correctness under optimization is the hard gate: every codegen_*.b golden
  # must match with the in-process -O2 pipeline + llc -O2. Executes the suite,
  # never greps.
  opt-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Codegen suite at -O2 (correctness under optimization)
        run: OPT_LEVEL=2 ./test_codegen.sh
      - name: ARC survives optimization (--leak-check at -O2)
        run: OPT_LEVEL=2 ./test_codegen.sh --leak-check
      - name: opt-delta.md recorded
        run: test -f docs/epics/001-toolchain-and-stdlib/opt-delta.md
      - name: --release builds and runs
        run: ./build/bcc --release demos/01_fibonacci.b -o /tmp/rel && /tmp/rel
      - name: cross-compile smoke (skip if no aarch64 target)
        run: |
          if llc-18 --version | grep -q aarch64; then
            ./build/bcc --target aarch64-unknown-linux-gnu -c test_files/pass/func_simple.b -o /tmp/x.o
            file /tmp/x.o | grep -qi aarch64
            echo "cross-compile: aarch64 object emitted"
          else
            echo "SKIP: llc-18 has no aarch64 target"
          fi

  # ---- 1c. Debug info: whole codegen suite built with -g + DWARF/gdb (U3/U6) ----
  debug-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev gdb
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Codegen suite with -g (correctness with debug info)
        run: DEBUG_INFO=1 ./test_codegen.sh
      - name: ARC survives debug info (--leak-check with -g)
        run: DEBUG_INFO=1 ./test_codegen.sh --leak-check
      - name: DWARF present + line table names the .b + -g -O2 verifies
        run: |
          ./build/bcc -g demos/01_fibonacci.b -o /tmp/fib
          llvm-dwarfdump-18 /tmp/fib | grep -q DW_TAG_subprogram
          llvm-dwarfdump-18 --debug-line /tmp/fib | grep -q 01_fibonacci.b
          ./build/bcc -g -O2 demos/01_fibonacci.b -o /tmp/fibg   # verifies clean under -O
      - name: gdb breakpoint smoke (function breakpoint = edit-stable)
        run: gdb -batch -ex 'break main' -ex run -ex bt /tmp/fib 2>&1 | grep -q 'Breakpoint 1'
      - name: DWARF/gdb smoke script
        run: ./test_files/debug/dwarf_gdb_smoke.sh

  # ---- 1d. Epic acceptance smoke: diagnostics + stdlib + count (U1/U4/U5/U6) ----
  epic-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev python3
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Diagnostics — multi-error (>= 3 located) + JSON schema + warning/-Werror
        run: |
          ./build/qcc test_files/fail/multi/three_errors.b 2>&1 | grep -Ec ':[0-9]+:[0-9]+: (error|warning):' | { read n; test "$n" -ge 3; }
          ./build/qcc --json test_files/fail/multi/three_errors.b 2>&1 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d)>=3 and all(k in d[0] for k in ("severity","file","line","col","message"))'
          ./build/qcc test_files/fail/warn/unused.b 2>&1 | grep -q 'warning:'
          if ./build/qcc -Werror test_files/fail/warn/unused.b 2>/dev/null; then echo "FAIL: -Werror did not promote"; exit 1; fi
      - name: Stdlib module tests (each area usable via bcc import)
        run: ./test_codegen.sh test_files/codegen_math_*.b test_files/codegen_time_*.b test_files/codegen_random_*.b test_files/codegen_env_*.b test_files/codegen_sort_*.b test_files/codegen_hashmap_*.b test_files/codegen_flags_*.b
      - name: New-test count >= 132 (baseline 107 + 25)
        run: test "$(ls test_files/codegen_*.b | wc -l)" -ge 132
      - name: Per-area specs exist AND were architect-reviewed
        run: |
          for a in diagnostics optimization debug stdlib; do
            ls specs/*"$a"* >/dev/null
            grep -rq 'Reviewed-by: architect' specs/*"$a"*
          done
          echo "All four area specs present + architect-reviewed."

  # ---- 2. Real bcc test runner (fixtures) ----
  bcc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: all_pass — exit 0 and 'N passed'
        run: |
          ./build/bcc test test_files/testblock/all_pass.b
          ./build/bcc test test_files/testblock/all_pass.b | grep -Eq '[0-9]+ passed'
      - name: has_failure — exit non-zero, FAIL + file:line
        run: |
          if ./build/bcc test test_files/testblock/has_failure.b > hf.log 2>&1; then
            echo "FAIL: has_failure.b exited 0"; cat hf.log; exit 1
          fi
          grep -Eq 'FAIL' hf.log
          grep -Eq '[^:]+\.b:[0-9]+:' hf.log
      - name: --filter — strict non-empty subset
        run: |
          full=$(./build/bcc test test_files/testblock/all_pass.b | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          filt=$(./build/bcc test --filter add_two test_files/testblock/all_pass.b | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          echo "full=$full filt=$filt"
          test "$filt" -gt 0 && test "$filt" -lt "$full"

  # ---- 3. Cross-module build fixtures (.bmod interfaces, factory ABI) ----
  build-system:
    # Cross-module build fixtures: .bmod interfaces, the library-emitted
    # construction factory, protocol conformance records, golden .bmod content,
    # and the cross-module destructor ASan/LSan leg.
    #
    # This suite carries ALL of the epic's cross-module evidence (done-conditions
    # 1, 5 and 6). Until this job existed it was run by nobody automatically.
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential binutils pkg-config git \
            libuv1-dev llvm-18-dev llvm-18 libzstd-dev libsqlite3-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Build sanitizer runtime archives
        # REQUIRED, not optional: run_build_tests.sh relinks the cross-module
        # fixture against these to prove the destructor hand-off is leak-clean.
        # Without them the ASan leg would skip -- and because CI=true is set
        # above, a skip is a hard FAILURE rather than a silent green.
        run: |
          cmake -S . -B build-asan -DBLANG_SANITIZE=address,undefined \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build-asan -j"$(nproc)"
      - name: Build-system integration suite
        run: ./test_build/run_build_tests.sh
      - name: Build-cache key unit test (.bmod format-version salt)
        run: ctest --test-dir build -R build_cache_key --output-on-failure
      - name: Golden .bmod files are committed and current
        # A format change must move a golden, or no reviewer can see it.
        # Regenerate into the working tree, THEN diff -- checking git status
        # without regenerating can never fail, because the suite only writes
        # goldens under UPDATE_GOLDENS=1.
        run: |
          UPDATE_GOLDENS=1 ./test_build/run_build_tests.sh > /dev/null
          git diff --exit-code -- test_files/golden/bmod/ || {
            echo "Golden .bmod files are stale. Regenerate with:"
            echo "  UPDATE_GOLDENS=1 ./test_build/run_build_tests.sh"
            exit 1
          }

  # ---- 4. Sanitizer (ASan/UBSan) build + leak-check with teeth ----
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # sqlite so the database codegen tests are exercised under --leak-check
          # (they SKIP without a real backend, which would hide DB-path leaks).
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev
      - name: Build (with LLVM) — needed by test_codegen.sh --leak-check
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Build sanitizer compiler (build-asan)
        run: |
          cmake -S . -B build-asan -DBLANG_SANITIZE=address,undefined -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build-asan -j"$(nproc)"
      - name: Parse suite under ASan
        run: BUILD_DIR=build-asan ./run_tests.sh
      - name: Leak-check teeth — injected leak must be fatal
        run: |
          if ./test_codegen.sh --leak-check test_files/testblock/leak_probe.b > probe.log 2>&1; then
            echo "FAIL: injected-leak fixture did not fail --leak-check"; cat probe.log; exit 1
          fi
          echo "Leak-check teeth verified: injected leak is fatal."
      - name: "Leak-check clean suite — Leaks: 0"
        run: |
          ./test_codegen.sh --leak-check | tee leak.log
          grep -Eq 'Leaks:[[:space:]]*0' leak.log

  # ---- 4. Runtime C-library unit tests (ctest), normal + under ASan ----
  runtime-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Build sanitizer config (build-asan)
        run: |
          cmake -S . -B build-asan -DBLANG_SANITIZE=address,undefined -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build-asan -j"$(nproc)"
      - name: ctest count >= 30 and green (build)
        run: |
          n=$(ctest --test-dir build -N | grep -c 'Test #')
          echo "runtime tests: $n"
          test "$n" -ge 30
          ctest --test-dir build --output-on-failure
      - name: ctest green under ASan (build-asan)
        run: ctest --test-dir build-asan --output-on-failure

  # ---- 5. Bounded parser fuzzing (libFuzzer, clang) ----
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang llvm
      - name: Build fuzz_parse (clang, libFuzzer)
        run: |
          # libFuzzer needs clang; the fuzz target lives in a dedicated clang
          # build dir build-fuzz (BLANG_ENABLE_LLVM=OFF, BLANG_FUZZ=ON) — it
          # cannot live in the gcc default build/. This is why the acceptance
          # command uses build-fuzz/fuzz_parse (see docs/epics/.../evaluation.md).
          cmake -S . -B build-fuzz -DBLANG_ENABLE_LLVM=OFF -DBLANG_FUZZ=ON \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --target fuzz_parse -j"$(nproc)"
      - name: Corpus count >= 20
        run: test "$(ls test_files/fuzz/corpus | wc -l)" -ge 20
      - name: Corpus replay (crash-free, -runs=0)
        run: build-fuzz/fuzz_parse test_files/fuzz/corpus/ -runs=0
      - name: Bounded campaign (-max_total_time=60)
        # -max_total_time bounds the campaign between inputs, but only -timeout
        # bounds a single input: if a mutation drives the parser into an
        # infinite loop, libFuzzer cannot honour -max_total_time and the job
        # would hang to the 20-minute cap. -timeout=30 makes any such hang fail
        # fast and loud (libFuzzer reports it as a crash) instead of hanging.
        run: build-fuzz/fuzz_parse test_files/fuzz/corpus/ -max_total_time=60 -timeout=30

  # ---- 6. Database codegen leg (origin feature line) + todo-app REST E2E ----
  # Origin's CI ran test_codegen.sh with SQLite installed so the query/insert/
  # update/delete goldens execute against a real backend. This job makes that
  # explicit and adds bcc migrate + the todo-app end-to-end REST test (build ->
  # migrate --apply -> CRUD with @json responses -> query Todo -> Array<Todo> ->
  # persistence), the epic done-condition's named database gates.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev pkg-config libsqlite3-dev curl
      - name: Build (with LLVM + SQLite backend)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: Confirm the SQLite backend is linked (not the stub)
        run: nm build/libblang_db.a | grep -q 'U sqlite3_'
      - name: Database codegen tests (param binding + query -> Array<T>)
        run: ./test_codegen.sh test_files/codegen_db_query.b test_files/codegen_db_query_rows.b
      - name: bcc migrate (schema derived from the table struct)
        run: |
          cd examples/todo_app
          rm -rf todos.db .blang
          ../../build/bcc build
          ../../build/bcc migrate --preview
          ../../build/bcc migrate --apply
          test -f .blang/schema.json
          rm -rf todos.db .blang
      - name: todo-app REST E2E (build -> migrate -> CRUD -> @json -> persistence)
        run: bash examples/todo_app/test_todo_app.sh

  # ---- 7. Demos ----
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libuv1-dev llvm-18-dev llvm-18 libzstd-dev
      - name: Build (with LLVM)
        run: |
          cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j"$(nproc)"
      - name: make -C demos all (builds NET_DEMOS incl 13_http_server, 15_timer)
        run: make -C demos all
      - name: make -C demos run (runs 01-10)
        run: make -C demos run

  # ---- 8. LSP: blangd golden transcripts + protocol-layer units + teeth ----
  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # No LLVM: blangd is parse+sema only and must build without it.
          sudo apt-get install -y cmake build-essential libuv1-dev pkg-config libsqlite3-dev neovim
      - name: Build blangd + jsonTest (no LLVM)
        run: |
          cmake -S . -B build -DBLANG_ENABLE_LLVM=OFF
          cmake --build build -j"$(nproc)" --target blangd jsonTest
      - name: Protocol-layer unit tests (jsonTest)
        run: ./build/jsonTest
      - name: Golden transcript suite (test_lsp.sh)
        run: ./test_lsp.sh
      - name: Inverted self-check — corrupted golden MUST go red (teeth)
        run: |
          set +e
          out="$(./test_lsp.sh --selfcheck 2>&1)"
          ret=$?
          set -e
          echo "$out"
          if [ "$ret" -eq 0 ]; then
            echo "ERROR: --selfcheck exited 0 (corrupted golden not detected)"
            exit 1
          fi
          echo "$out" | grep -q '^SELFCHECK: OK$' || {
            echo "ERROR: --selfcheck did not print SELFCHECK: OK"
            exit 1
          }
      - name: Determinism — transcript identical across two runs
        run: |
          python3 tools/lsp_client.py --server build/blangd --root "$PWD" \
            --script test_files/lsp/diag_change.lsp.jsonl > /tmp/run1.out
          python3 tools/lsp_client.py --server build/blangd --root "$PWD" \
            --script test_files/lsp/diag_change.lsp.jsonl > /tmp/run2.out
          diff /tmp/run1.out /tmp/run2.out
      - name: Headless-Neovim smoke (real LSP client end to end)
        run: ./test_lsp_nvim.sh
